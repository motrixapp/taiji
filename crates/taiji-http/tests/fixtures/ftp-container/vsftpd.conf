# taiji FTP 容器互通矩阵 — vsftpd（inetd 形态：每连接独立 vsftpd 进程）
#
# 为什么是 inetd 形态（互通实测发现，如实声明）：vsftpd 3.0.3（上游最终版）
# 的常驻监听形态（listen=YES）在本矩阵环境一次成功 RETR 后守护进程即段
# 错误退出（与 TLS/sendfile/文件系统/libc/并发均无关，详见
# tests/ftp_container_matrix.rs 模块文档）；inetd 形态下每连接是独立
# vsftpd 进程，彻底绕开该缺陷，多会话/并发面稳定。
#
# 挂载面：本文件 → /etc/vsftpd/taiji.conf；container_server_cert.pem/
# container_server_key.pem → /etc/ssl/taiji/；内容目录 → /srv/ftp/pub。
# inetd 监听口由镜像 CMD 经 INETD_PORT 环境变量注入（明文 21 / 隐式 990）。
# PASV 端口段按实例分立（与 docker 发布段一致）。
listen=NO
connect_from_port_20=NO
ftpd_banner=220 taiji ftp container matrix ready
# PASV/EPSV 数据面：容器侧端口段经 docker 发布映射（宿主同名段），
# pasv_address=127.0.0.1 使 227 回复合口令回环地址（容器 NAT 面）。
pasv_enable=YES
pasv_min_port=50100
pasv_max_port=50199
pasv_address=127.0.0.1
port_enable=YES
# 匿名行（默认 anonymous/anonymous@）
anonymous_enable=YES
anon_root=/srv/ftp/pub
anon_upload_enable=NO
anon_mkdir_write_enable=NO
# 认证行：taiji 用户家目录即 pub 挂载点（chroot = 内容根）
local_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
download_enable=YES
write_enable=NO
# 显式 TLS：FEAT 广告 AUTH TLS；force_*=NO 允许明文行共存（能力协商而非强制）；
# PROT P 后数据面同走 TLS；rustls 无会话恢复 → require_ssl_reuse=NO
ssl_enable=YES
allow_anon_ssl=YES
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/taiji/server.pem
rsa_private_key_file=/etc/ssl/taiji/server.key
# 容器内运行面（seccomp 沙箱与容器默认 profile 叠加时偶发 ENOSYS；
# secure_chroot_dir = Debian 惯例路径，镜像构建期 mkdir 兜底）
seccomp_sandbox=0
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
use_localtime=NO
syslog_enable=NO
xferlog_enable=NO
