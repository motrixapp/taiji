# taiji FTP 容器互通矩阵 — vsftpd 隐式 TLS（inetd 形态：每连接独立进程；
# INETD_PORT=990：连接即 TLS 握手，无明文阶段）
# 挂载面同 vsftpd.conf；PASV 段与明文实例分立。
listen=NO
connect_from_port_20=NO
ftpd_banner=220 taiji ftp container matrix ready
pasv_enable=YES
pasv_min_port=51100
pasv_max_port=51199
pasv_address=127.0.0.1
port_enable=YES
anonymous_enable=YES
anon_root=/srv/ftp/pub
anon_upload_enable=NO
anon_mkdir_write_enable=NO
local_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
download_enable=YES
write_enable=NO
# 隐式 TLS：控制面连接即握手；数据面经 PBSZ 0 + PROT P
implicit_ssl=YES
ssl_enable=YES
allow_anon_ssl=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/taiji/server.pem
rsa_private_key_file=/etc/ssl/taiji/server.key
seccomp_sandbox=0
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
use_localtime=NO
syslog_enable=NO
xferlog_enable=NO
