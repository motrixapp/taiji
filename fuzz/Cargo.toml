# the WebVTT
# cue parser + timeline splice of the subtitle-sidecar line —
# cue-level parsing with timestamp rebasing is a §10 parse-surface
# red line, so the fuzz target is mandatory (panic-free caps/order/
# determinism invariants asserted through the fuzz surface).
[[bin]]
name = "vtt_splice"
path = "fuzz_targets/vtt_splice.rs"
test = false
doc = false
bench = false

# the ISO-BMFF read surface (iter_boxes /
# read_moof / parse_init / fold_track) — hostile bytes are explicit
# errors, never panics; the box-end integer-wraparound shape
# (largesize = 2^64 - k, the /tmp/shiftpoc crash) is the seed of
# record.
[[bin]]
name = "bmff"
path = "fuzz_targets/bmff.rs"
test = false
doc = false
bench = false

# the output-template expansion +
# forced-sanitization face (the §11 injection-vector family is the
# committed seed corpus; the untrusted-remote-string guarantees —
# no separator/control/leading-dash, length clamp, non-empty — are
# asserted through the fuzz surface).
[[bin]]
name = "template"
path = "fuzz_targets/template.rs"
test = false
doc = false
bench = false

# the three-layer selector expression
# face (a raw RPC string; parse determinism + resolution-named-URIs-
# exist invariants asserted through the fuzz surface; the expression
# matrix is the committed seed corpus).
[[bin]]
name = "selector"
path = "fuzz_targets/selector.rs"
test = false
doc = false
bench = false

# the
# MPD (DASH) parse + expansion surface — quick-xml streaming with
