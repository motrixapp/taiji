name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runs-on: macos-latest
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-macos-arm64.tar.gz
          - platform: macos-x64
            target: x86_64-apple-darwin
            runs-on: macos-latest
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-macos-x64.tar.gz
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-linux-x64.tar.gz
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-linux-arm64.tar.gz
          - platform: windows-x64
            target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            bin: taiji.exe
            archive: zip
            artifact: taiji-sidecar-windows-x64.zip
          - platform: windows-arm64
            target: aarch64-pc-windows-msvc
            runs-on: windows-latest
            bin: taiji.exe
            archive: zip
            artifact: taiji-sidecar-windows-arm64.zip
          - platform: android-arm64
            target: aarch64-linux-android
            runs-on: ubuntu-22.04
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-android-arm64.tar.gz

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ matrix.platform }}"
          shared-key: "build-release-${{ matrix.target }}"

      # Android arm64 cross build on an ubuntu-22.04 x64 host.
      #
      # Pinned NDK download (no Java, no sdkmanager, no setup-android):
      # version + sha1 below are lifted verbatim from Google's official
      # repository manifest
      #   https://dl.google.com/android/repository/repository2-3.xml
      # (remotePackage ndk;30.0.16248370, channel-0/stable,
      #  archive host-os=linux, checksum type=sha1). Upgrades are an
      # explicit commit: bump NDK_VERSION together with NDK_SHA1 (and
      # the unpacked directory name inside the zip —
      # android-ndk-<NDK_VERSION>), re-read from that manifest; the
      # pinned-NDK discipline mirrors the pinned rust-toolchain above.
      - name: Install pinned Android NDK (no Java)
        if: matrix.platform == 'android-arm64'
        env:
          NDK_VERSION: r30
          NDK_SHA1: 5107f898313790e449e87eee2183d9a20602dee9
        run: |
          set -euo pipefail
          url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          curl -sSL --retry 5 --retry-connrefused -o /tmp/ndk.zip "$url"
          echo "${NDK_SHA1}  /tmp/ndk.zip" | sha1sum -c -
          sudo unzip -q /tmp/ndk.zip -d /opt
          ndk_home="/opt/android-ndk-${NDK_VERSION}"
          test -x "${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          {
            echo "ANDROID_NDK_HOME=${ndk_home}"
            echo "ANDROID_NDK_ROOT=${ndk_home}"
          } >> "$GITHUB_ENV"

      # Build determinism policy (packaging/README.md §5): RUSTFLAGS pinned to
      # remap-path-prefix and a --locked build (Cargo.lock). linux-x64 and
      # linux-arm64 run on ubuntu-22.04 hosts (glibc >= 2.35 floor); macos-x64
      # is a cross compile (x86_64-apple-darwin) on an Apple-Silicon macos-latest
      # host; windows-arm64 cross compiles through MSVC on windows-latest.
      - name: Build taiji release
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/taiji
          # Android cross-compile face (only consulted for the
          # aarch64-linux-android target; empty strings elsewhere).
          CC_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          CXX_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++
          AR_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

      # Layout per packaging/README.md §1: exactly four items in
      # taiji-sidecar-<platform>/ — the binary, VERSION.json (version
      # derived from the tag, never hard-coded), THIRD-PARTY-NOTICES.md
      # (crate@version summary from Cargo.lock, workspace members
      # filtered out), SHA256SUMS over the layout (excluding itself).
      - name: Assemble layout, VERSION.json, THIRD-PARTY-NOTICES.md, SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          dir="taiji-sidecar-${{ matrix.platform }}"
          mkdir -p "${dir}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${dir}/"
          cat > "${dir}/VERSION.json" <<EOF
          {
            "version": "${ver}",
            "version_string": "taiji/${ver}",
            "git_sha": "${{ github.sha }}",
            "git_dirty": false,
            "build_time_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "target": "${{ matrix.target }}",
            "platform_layout": "${dir}",
            "rustc": "$(rustc --version | head -1)",
            "profile": "release",
            "rustflags": "--remap-path-prefix=<repo>=/taiji",
            "cargo_locked": true,
            "platform_matrix": ["macos-arm64","macos-x64","linux-x64","linux-arm64","windows-x64","windows-arm64","android-arm64"]
          }
          EOF
          {
            echo "## Third Party Notices"
            echo ""
            echo "taiji is licensed under GPL-2.0-or-later. This"
            echo "distribution statically links the third-party crates"
            echo "below (name@version, resolved from the pinned"
            echo "Cargo.lock). Full per-crate license text is expanded"
            echo "in the M5 release process (cargo about / cargo deny)."
            echo ""
            grep -E '^name = |^version = ' Cargo.lock \
              | paste -d'@' - - \
              | sed 's/name = //; s/version = //; s/"//g' \
              | grep -v '^taiji' || true
          } > "${dir}/THIRD-PARTY-NOTICES.md"
          (
            cd "${dir}"
            # sha256sum exists on all three GitHub host images (macOS via
            # coreutils); the sum manifest covers the layout minus itself.
            sha256sum "${{ matrix.bin }}" VERSION.json THIRD-PARTY-NOTICES.md > SHA256SUMS
          )
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${{ matrix.artifact }}" "./${dir}"/*
          else
            tar -czf "${{ matrix.artifact }}" "./${dir}"/*
          fi

      - name: Upload artifact (fallback copy, 90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: ${{ matrix.artifact }}
          retention-days: 90
          if-no-files-found: error

      # One matrix job wins the create (the rest see "already exists" and
      # fall through to the view check); the upload itself must NOT be
      # silenced — a missing asset must fail the job loudly. --clobber
      # makes re-pushed tags replace stale same-named assets instead of
      # colliding. Draft on purpose: a person promotes it after inspecting
      # SHA256SUMS + VERSION.json (the staged-rollout posture).
      - name: Attach artifact to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "taiji ${GITHUB_REF_NAME}" \
              --notes "Release build from tag ${GITHUB_REF_NAME}. Platform matrix aligned with Motrix: macos-arm64, macos-x64 (cross on Apple Silicon), linux-x64 / linux-arm64 (ubuntu-22.04, glibc >= 2.35), windows-x64 / windows-arm64 (MSVC cross), android-arm64 (pinned NDK cross). Layout + SHA256SUMS per packaging/README.md; build determinism per §5 (--locked, remapped paths). Draft until inspected." \
              "${{ matrix.artifact }}#${{ matrix.artifact }}" || \
            gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${{ matrix.artifact }}#${{ matrix.artifact }}"
