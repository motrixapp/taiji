- id: seed-check-sticky-latch
  kind: known-deviation
  where: "taiji/crates/taiji-domain/src/seed.rs:195-207"
  what: >-
    SeedCheck 的 started 锁存有意粘滞:首个 Finished tick 置闩并 reset 后,相位回退(Finished→Running)既不清闸也不再 reset,Running tick 继续评估、seed-time 锚定首次完成时刻——刻意保持 aria2 checkStarted_ 语义,拒绝"回退即复位"的自然实现(审计报告 D6 的复位建议被此偏差决策否决)。
  refs: >-
    pin 测试 seed.rs:688-742(seed_check_latch_is_sticky_across_phase_regression,注释明确 "Clearing the latch would restart seed-time after every regress-and-complete cycle, diverging from aria2; pinned against such a 'fix'");tick 实现 seed.rs:195-207;对等源码 aria2-1.37.0/src/SeedCheckCommand.cc:71-82(checkStarted_ 首个 downloadFinished tick 置位,永不回清);审计报告 taiji-implicit-state-machines-zh.md:2308-2321(D6 建议回退复位)与 :307(高危#12);该 pin 测试由提交 59dae99d(#8)加入(git log -S 验证)

