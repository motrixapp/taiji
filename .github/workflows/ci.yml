name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      # The full debug build of this workspace + the GiB-scale e2e
      # fixtures exceed the runner's stock free space (two consecutive
      # no-space failures); drop the preinstalled SDK bloat (~25GB).
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
      - uses: actions/checkout@v4
      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # download_rpc_e2e spawns rqbit as the swarm counterpart (a harness
      # dependency; dev machines have it via cargo install). Pinned to an
      # exact release for reproducibility; bump deliberately.
      - name: Install rqbit (e2e harness dependency)
        run: |
          curl -sSL -o /usr/local/bin/rqbit \
            https://github.com/ikatson/rqbit/releases/download/v9.1.0/rqbit-linux-amd64
          chmod +x /usr/local/bin/rqbit
          rqbit --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The live two-process differential defaults red without the fork
      # reference binary (fail-closed by design, rpc-api-diff §governance);
      # CI has no reference checkout, so downgrade to the documented
      # SKIP-green — the output keeps the machine-readable
      # `SKIP(taiji.rpc.live-diff): …` marker for consumers to check.
      # Restore a real reference (build the fork + TAIJI_DIFF_ARIA2C)
      # before removing this.
      # --no-fail-fast: surface every failing suite in one run (this
      # branch's Linux legs were unreachable for its whole history and
      # the backlog is being worked through; fail-fast hides the tail).
      - run: cargo test --workspace --all-targets --no-fail-fast
        env:
          TAIJI_DIFF_ALLOW_SKIP: "1"

  store-bt-subset:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p taiji-store --lib
      - run: cargo test -p taiji-bt --test filetree_fixture
      # Windows-semantics regression for the on-disk surface (sync_dir/seek_write/rename)
      - run: cargo test -p taiji-http --lib

  # metalink feature-off two-legged job (--no-default-features: one leg each
  # for taiji-rpc/taiji, off-state compile + test — without a CI guard
  # the off-state compile surface rots freely).
  feature-off-metalink:
    strategy:
      fail-fast: false
      matrix:
        crate: [taiji-rpc, taiji]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Same e2e harness dependency as the gates job (the taiji crate leg
      # runs download_rpc_e2e here too).
      - name: Install rqbit (e2e harness dependency)
        run: |
          curl -sSL -o /usr/local/bin/rqbit \
            https://github.com/ikatson/rqbit/releases/download/v9.1.0/rqbit-linux-amd64
          chmod +x /usr/local/bin/rqbit
          rqbit --version
      - run: cargo clippy -p ${{ matrix.crate }} --no-default-features --all-targets -- -D warnings
      - run: cargo test -p ${{ matrix.crate }} --no-default-features --all-targets
        env:
          # Same documented downgrade as the gates job: no fork reference
          # binary on CI (see the comment there).
          TAIJI_DIFF_ALLOW_SKIP: "1"
