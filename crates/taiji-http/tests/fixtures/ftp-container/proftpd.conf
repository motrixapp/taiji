# taiji FTP 容器互通矩阵 — proftpd（明文控制 21；FEAT 广告 AUTH TLS，按需显式升级）
# 挂载面：本文件 → /etc/proftpd/proftpd.conf；server_cert.pem/server_key.pem →
# /etc/ssl/taiji/；内容目录 → /srv/ftp/pub。启动：proftpd --nodaemon。
# Debian 布局的模块清单（mod_tls 为 DSO，需经 modules.conf LoadModule）；
# 适配镜像：debian 系自建镜像与 kibatic/proftpd（构建期已启用 mod_tls）。
Include /etc/proftpd/modules.conf
ServerName "taiji ftp container matrix"
ServerType standalone
DefaultServer on
Port 21
UseIPv6 off
UseReverseDNS off
WtmpLog off
# PASV/EPSV 数据面：容器侧端口段 + 对外宣称宿主回环
PassivePorts 52100 52199
MasqueradeAddress 127.0.0.1
# 认证行：taiji 用户经容器内 useradd 注入；绕过 PAM 走 passwd/shadow；
# 不读 /etc/ftpusers（Debian 基座把 nobody 等系统户列入禁登，会拒掉匿名映射）
AuthOrder mod_auth_unix.c
UseFtpUsers off
RequireValidShell off
DefaultRoot /srv/ftp/pub
Umask 022
# 匿名行：USER anonymous/ftp 触发 <Anonymous>（显式 UserAlias 兜底）
<Anonymous /srv/ftp/pub>
  User nobody
  Group nogroup
  UserAlias anonymous nobody
  UserAlias ftp nobody
  AnonRequirePassword off
  <Limit LOGIN>
    AllowAll
  </Limit>
  <Directory />
    <Limit WRITE>
      DenyAll
    </Limit>
  </Directory>
</Anonymous>
# mod_tls：显式升级按需（TLSRequired off 允许明文行共存）；
# PROT P 后数据面同走 TLS；rustls 无会话恢复 → NoSessionReuseRequired
<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired off
  TLSVerifyClient off
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/ssl/taiji/server.pem
  TLSRSACertificateKeyFile /etc/ssl/taiji/server.key
  TLSOptions NoSessionReuseRequired
  TLSLog /dev/null
</IfModule>
