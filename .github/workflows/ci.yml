name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Exclude closed: the post-merge close event once raced the main
    # push run inside the same concurrency group and cancelled it
    # (leaving a cancelled X on the merge commit) — and running CI on
    # an already-merged/closed PR is pure waste anyway.
    types: [opened, synchronize, reopened]

# Efficiency practices per github/awesome-copilot skills/
# github-actions-efficiency: cancel the superseded in-flight run on the
# same ref (a 25-minute gates pipeline per stale push is pure waste);
# least privilege at the top (no job here needs write).
#
# Deliberately NO path filters: governance tests read docs/*.md
# (spec_matrix -> docs/spec.md, budget_key_registration ->
# docs/rpc-api.md), so a docs-only push is a validation-relevant push —
# narrowing triggers here would hide required validation.
permissions:
  contents: read

concurrency:
  # Keyed by the branch name on both faces (PRs use head_ref, pushes
  # use ref_name) so a PR's events and the main push after its merge
  # never share a group — github.ref (refs/pull/N/merge vs
  # refs/heads/main) blurred exactly that boundary once.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The full debug build of this workspace + the GiB-scale e2e
      # fixtures exceed the runner's stock free space (two consecutive
      # no-space failures); drop the preinstalled SDK bloat (~25GB).
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
      - uses: actions/checkout@v4
      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # download_rpc_e2e spawns rqbit as the swarm counterpart (a harness
      # dependency; dev machines have it via cargo install). Pinned to an
      # exact release for reproducibility; bump deliberately.
      - name: Install rqbit (e2e harness dependency)
        run: |
          set -euo pipefail
          # Transient edge flakiness once served an HTML error page here
          # (which then exploded as a shell syntax error); retry and
          # verify the ELF magic so a bad download fails loudly at the
          # install step instead of downstream in the e2e suite.
          for i in 1 2 3 4 5; do
            curl -sSL --retry 5 --retry-connrefused \
              -o /usr/local/bin/rqbit \
              https://github.com/ikatson/rqbit/releases/download/v9.1.0/rqbit-linux-amd64 \
              && head -c4 /usr/local/bin/rqbit | od -An -tx1 | grep -q '7f 45 4c 46' && break
            echo "retry $i: bad download, retrying"; sleep $((i * 5))
          done
          head -c4 /usr/local/bin/rqbit | od -An -tx1 | grep -q '7f 45 4c 46' \
            || { echo "rqbit download kept failing (not an ELF)"; exit 1; }
          chmod +x /usr/local/bin/rqbit
          rqbit --version
      - run: python3 -m unittest discover -s packaging -p '*_test.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The live two-process differential defaults red without the fork
      # reference binary (fail-closed by design, rpc-api-diff §governance);
      # CI has no reference checkout, so downgrade to the documented
      # SKIP-green — the output keeps the machine-readable
      # `SKIP(taiji.rpc.live-diff): …` marker for consumers to check.
      # Restore a real reference (build the fork + TAIJI_DIFF_ARIA2C)
      # before removing this.
      # --no-fail-fast: surface every failing suite in one run (this
      # branch's Linux legs were unreachable for its whole history and
      # the backlog is being worked through; fail-fast hides the tail).
      - run: cargo test --workspace --all-targets --no-fail-fast
        env:
          TAIJI_DIFF_ALLOW_SKIP: "1"

  store-bt-subset:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p taiji-store --lib
      - run: cargo test -p taiji-bt --test filetree_fixture
      # Windows-semantics regression for the on-disk surface (sync_dir/seek_write/rename)
      - run: cargo test -p taiji-http --lib

      - name: Build the Windows sidecar with a static CRT
        if: runner.os == 'Windows'
        run: cargo build --locked -p taiji --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=/STACK:8388608
      - name: Verify Windows runtime dependencies and version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/x86_64-pc-windows-msvc/debug/taiji.exe"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cannot read workspace version" }
          $version = ($metadata.packages | Where-Object { $_.name -eq 'taiji' }).version
          $expectedVersion = "taiji/$version"
          $reportedVersion = & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "sidecar startup failed: $LASTEXITCODE" }
          if ($reportedVersion.Trim() -ne "taiji $expectedVersion") { throw "unexpected CLI version: $reportedVersion" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw "dumpbin is unavailable" }
          $imports = & $dumpbin /DEPENDENTS $binary
          if ($LASTEXITCODE -ne 0) { throw "dependency inspection failed" }
          if ($imports -match '(?i)(VCRUNTIME|MSVCP)[0-9].*\.dll') {
            throw "sidecar depends on an external Visual C++ runtime"
          }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $root = Join-Path $env:RUNNER_TEMP "taiji-rpc-smoke"
          New-Item -ItemType Directory -Force $root | Out-Null
          $process = Start-Process -FilePath (Resolve-Path $binary) -WorkingDirectory $root -ArgumentList @(
            '--enable-rpc', '--rpc-secret=ci-test-secret-020', "--rpc-listen-port=$port",
            '--enable-dht=false', '--enable-dht6=false', '--bt-lsd=false'
          ) -PassThru -NoNewWindow
          try {
            $uri = "http://127.0.0.1:$port/jsonrpc"
            $request = @{jsonrpc='2.0'; id=1; method='taiji.getVersion'; params=@('token:ci-test-secret-020')} | ConvertTo-Json -Compress
            $ready = $false
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              if ($process.HasExited) { throw "sidecar exited: $($process.ExitCode)" }
              try {
                $reply = Invoke-RestMethod -Uri $uri -Method Post -ContentType 'application/json' -Body $request -TimeoutSec 2
                if ($reply.result.version -eq $expectedVersion) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 200 }
            }
            if (!$ready) { throw "RPC readiness timed out" }
            $shutdown = @{jsonrpc='2.0'; id=2; method='taiji.shutdown'; params=@('token:ci-test-secret-020')} | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri $uri -Method Post -ContentType 'application/json' -Body $shutdown -TimeoutSec 2 | Out-Null
            if (!$process.WaitForExit(10000) -or $process.ExitCode -ne 0) { throw "RPC shutdown failed" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  # metalink feature-off two-legged job (--no-default-features: one leg each
  # for taiji-rpc/taiji, off-state compile + test — without a CI guard
  # the off-state compile surface rots freely).
  feature-off-metalink:
    strategy:
      fail-fast: false
      matrix:
        crate: [taiji-rpc, taiji]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Same e2e harness dependency as the gates job (the taiji crate leg
      # runs download_rpc_e2e here too).
      - name: Install rqbit (e2e harness dependency)
        run: |
          set -euo pipefail
          # Transient edge flakiness once served an HTML error page here
          # (which then exploded as a shell syntax error); retry and
          # verify the ELF magic so a bad download fails loudly at the
          # install step instead of downstream in the e2e suite.
          for i in 1 2 3 4 5; do
            curl -sSL --retry 5 --retry-connrefused \
              -o /usr/local/bin/rqbit \
              https://github.com/ikatson/rqbit/releases/download/v9.1.0/rqbit-linux-amd64 \
              && head -c4 /usr/local/bin/rqbit | od -An -tx1 | grep -q '7f 45 4c 46' && break
            echo "retry $i: bad download, retrying"; sleep $((i * 5))
          done
          head -c4 /usr/local/bin/rqbit | od -An -tx1 | grep -q '7f 45 4c 46' \
            || { echo "rqbit download kept failing (not an ELF)"; exit 1; }
          chmod +x /usr/local/bin/rqbit
          rqbit --version
      - run: cargo clippy -p ${{ matrix.crate }} --no-default-features --all-targets -- -D warnings
      - run: cargo test -p ${{ matrix.crate }} --no-default-features --all-targets
        env:
          # Same documented downgrade as the gates job: no fork reference
          # binary on CI (see the comment there).
          TAIJI_DIFF_ALLOW_SKIP: "1"
