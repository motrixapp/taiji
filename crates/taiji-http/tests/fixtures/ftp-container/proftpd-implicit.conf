# taiji FTP 容器互通矩阵 — proftpd 隐式 TLS（端口 990：控制面+数据面连接即 TLS）
# 挂载面同 proftpd.conf；启动：proftpd --nodaemon。
Include /etc/proftpd/modules.conf
ServerName "taiji ftp container matrix"
ServerType standalone
DefaultServer on
Port 990
UseIPv6 off
UseReverseDNS off
WtmpLog off
PassivePorts 53100 53199
MasqueradeAddress 127.0.0.1
AuthOrder mod_auth_unix.c
UseFtpUsers off
RequireValidShell off
DefaultRoot /srv/ftp/pub
Umask 022
<Anonymous /srv/ftp/pub>
  User nobody
  Group nogroup
  UserAlias anonymous nobody
  UserAlias ftp nobody
  AnonRequirePassword off
  <Limit LOGIN>
    AllowAll
  </Limit>
  <Directory />
    <Limit WRITE>
      DenyAll
    </Limit>
  </Directory>
</Anonymous>
<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired on
  TLSVerifyClient off
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/ssl/taiji/server.pem
  TLSRSACertificateKeyFile /etc/ssl/taiji/server.key
  # 隐式 TLS：控制面与数据面连接即 TLS（无明文 AUTH/PROT 协商阶段）
  TLSOptions UseImplicitSSL NoSessionReuseRequired
  TLSLog /dev/null
</IfModule>
