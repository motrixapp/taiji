[package]
name = "taiji-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: not part of the main workspace's gate ( the gate
# runs crates/*); the fuzz gate is triggered by the nightly cluster on
# schedule.
[workspace]

[dependencies]
taiji-bt = { path = "../crates/taiji-bt" }
taiji-http = { path = "../crates/taiji-http" }
# the cookies target follows the module into the segment
# vocabulary crate (the verbatim lift from taiji-http).
taiji-segment = { path = "../crates/taiji-segment" }
taiji-io = { path = "../crates/taiji-io" }
taiji-store = { path = "../crates/taiji-store" }
taiji-rpc = { path = "../crates/taiji-rpc" }
# security-audit work: wiring up the core/domain parsers
# (option strings / sizes / select-file and the Metainfo top level).
taiji-core = { path = "../crates/taiji-core" }
taiji-domain = { path = "../crates/taiji-domain" }
# the metalink v4 whole-document byte-stream parse
# surface (the parser = a fuzz-roster duty).
taiji-metalink = { path = "../crates/taiji-metalink" }
# the ffmpeg -progress line-protocol parser and
# the ffprobe JSON structuring surface (both fuzz-roster duty rows).
taiji-media = { path = "../crates/taiji-media" }
# Round-trip assertion of the ffprobe-json fuzz target (same version as
# the workspace registry row).
serde_json = "1"
bytes = "1"
# Probe URL construction for the cookie fuzz target (same version lock as
# reqwest's url dependency).
url = "2"
tokio-util = { version = "0.7", features = ["codec"] }
libfuzzer-sys = "0.4"
# Align with the main repo's rand 0.10 (udp_tracker_reply's tracker client
# API takes the 0.10 Rng trait — the earlier 0.9 declaration was left
# broken and failing to compile in this standalone workspace; fixed along
#).
rand = "0.10"

