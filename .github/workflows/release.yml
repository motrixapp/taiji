# taiji release — build (unsigned) + attach, split from signing.
#
# Pipeline shape (aligned with the Motrix / ffmpeg-static pattern):
#   release.yml: build matrix → single attach job → DRAFT release
#   sign-macos.yml: human-dispatched, environment-gated macOS
#   codesign + notarization that replaces the macos assets in place.
#
# Artifacts are deliberately UNSIGNED at this stage; macOS signing is a
# separate privileged workflow (sign-macos.yml) — never in the same job
# that compiles untrusted source.
#
# Efficiency practices per github/awesome-copilot skills/
# github-actions-efficiency: no cancel-in-progress on a release ref
# (a tagged build is never wasted mid-flight), job timeouts, least
# privilege (read at the top; write only on the attach job), actions
# pinned to 40-char commit SHAs, full matrix breadth kept (all seven
# platforms are a shipped commitment, not accident).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runs-on: macos-latest
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-macos-arm64.tar.gz
          - platform: macos-x64
            target: x86_64-apple-darwin
            runs-on: macos-latest
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-macos-x64.tar.gz
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-linux-x64.tar.gz
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-linux-arm64.tar.gz
          - platform: windows-x64
            target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            bin: taiji.exe
            archive: zip
            artifact: taiji-sidecar-windows-x64.zip
          - platform: windows-arm64
            target: aarch64-pc-windows-msvc
            runs-on: windows-latest
            bin: taiji.exe
            archive: zip
            artifact: taiji-sidecar-windows-arm64.zip
          - platform: android-arm64
            target: aarch64-linux-android
            runs-on: ubuntu-22.04
            bin: taiji
            archive: tar.gz
            artifact: taiji-sidecar-android-arm64.tar.gz

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      # actions/checkgout v4.1.1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the release tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "motrixapp/taiji" ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      # Pinned toolchain, aligned with local (2026-10-13): stable rollover once
      # caused two-way fmt/dead-code drift; upgrades need an explicit commit and
      # a full pass of the local gate.
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.13
        with:
          prefix-key: "v1-rust-${{ matrix.platform }}"
          shared-key: "build-release-${{ matrix.target }}"

      # Android arm64 cross build on an ubuntu-22.04 x64 host.
      #
      # Pinned NDK download (no Java, no sdkmanager): version + sha1 are
      # lifted verbatim from Google's repository manifest
      #   https://dl.google.com/android/repository/repository2-3.xml
      # (remotePackage ndk;30.0.16248370, stable channel, host-os=linux
      # archive, checksum type=sha1). Upgrades are an explicit commit:
      # bump NDK_VERSION together with NDK_SHA1, re-read from that
      # manifest — the pinned-NDK discipline mirrors the pinned
      # rust-toolchain above.
      - name: Install pinned Android NDK (no Java)
        if: matrix.platform == 'android-arm64'
        env:
          NDK_VERSION: r30
          NDK_SHA1: 5107f898313790e449e87eee2183d9a20602dee9
        run: |
          set -euo pipefail
          url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          curl -sSL --retry 5 --retry-connrefused -o /tmp/ndk.zip "$url"
          echo "${NDK_SHA1}  /tmp/ndk.zip" | sha1sum -c -
          sudo unzip -q /tmp/ndk.zip -d /opt
          ndk_home="/opt/android-ndk-${NDK_VERSION}"
          test -x "${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          {
            echo "ANDROID_NDK_HOME=${ndk_home}"
            echo "ANDROID_NDK_ROOT=${ndk_home}"
          } >> "$GITHUB_ENV"

      # Build determinism policy (packaging/README.md §5): RUSTFLAGS
      # pinned to remap-path-prefix and a --locked build (Cargo.lock).
      # linux legs run on ubuntu-22.04 hosts (glibc >= 2.35 floor);
      # macos-x64 cross compiles on an Apple-Silicon host; windows-arm64
      # cross compiles through MSVC.
      - name: Build taiji release
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/taiji ${{ endsWith(matrix.target, '-windows-msvc') && '-C target-feature=+crt-static -C link-arg=/STACK:8388608' || '' }}
          # Android cross-compile face (only consulted for the
          # aarch64-linux-android target; empty elsewhere).
          CC_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64-linux-android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

      # Source version and tag must agree before anything is attached.
      - name: Assemble the sidecar, provenance and full license notices
        shell: bash
        run: |
          set -euo pipefail
          dir="taiji-sidecar-${{ matrix.platform }}"
          python3 packaging/assemble.py \
            --version "${GITHUB_REF_NAME}" \
            --target "${{ matrix.target }}" \
            --platform "${{ matrix.platform }}" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            --output "${dir}" \
            --archive "${{ matrix.artifact }}"

      # actions/upload-artifact v4.6.2 — handoff to the attach job is
      # digest-bound by upload-artifact's own zip manifest.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: error

  # Single non-matrix job owns the release: no create/create race, one
  # place with write permission, one set of release notes. Draft on
  # purpose — a person (or sign-macos.yml) inspects and publishes.
  attach:
    name: attach (draft release)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release and upload every artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(dist/*)
          echo "attaching ${#files[@]} artifacts: ${files[*]}"
          test "${#files[@]}" -eq 7
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "taiji ${GITHUB_REF_NAME}" \
              --notes "Release build from tag ${GITHUB_REF_NAME}.

          Platform matrix aligned with Motrix: macos-arm64, macos-x64
          (cross on Apple Silicon), linux-x64 / linux-arm64
          (ubuntu-22.04, glibc >= 2.35), windows-x64 / windows-arm64
          (MSVC cross), android-arm64 (pinned NDK cross).

          macOS assets are unsigned at this stage — run sign-macos.yml
          to codesign + notarize the CLI binaries, then publish. Layout +
          SHA256SUMS per packaging/README.md; build determinism per §5."
          fi
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" = true
          # Unquoted glob: the shell expands every artifact path —
          # the previous printf form globbed the bare working dir into
          # 'dist/dist' and matched nothing.
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber dist/*
