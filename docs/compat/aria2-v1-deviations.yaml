# 读法对齐 aria2 语义,回归测试锁的是"不读簿记 Option"这一决策本身。Phase C 差分豁免
# 按 id 预计不会命中本条,属预期(决策记录)。
- id: peer-status-am-choking-live-bool
  kind: known-deviation
  where: "taiji/crates/taiji-engine/src/query.rs:269-272"
  what: >-
    peerStatus 的 am_choking 有意读 live 的 am_unchoked 位(!ps.am_unchoked),不读 last_unchoke 簿记 Option——对齐 aria2 live-bool 语义(直读当前 choke 位),re-choke 后残留的 last_unchoke 不得掩盖真实 choke 状态。
  refs: >-
    query.rs:269-272 注释 "Live bool (aria2 RpcMethodImpl.cc reads the current am-choking state; a stale last_unchoke after a re-choke must still read true)";回归锚 tests.rs:7730-7788(peer_snapshots_am_choking_reads_unchoke_state,C 行=回归锚点);aria2-1.37.0/src/RpcMethodImpl.cc:774(KEY_AM_CHOKING 直读 peer->amChoking());提交 f5f17ac9(fix/high-risk-implicit-state-machines 分支,标题 "peerStatus am_choking reads the live am_unchoked bit (aria2 live-bool semantics)",git show 验证)及 main 上 squash 合入的 b1f26d08(#9,同名 bullet);审计报告 :201(修前分歧记录:RPC 读 Option、轮次维护 bool)、:2498(建议#4)

