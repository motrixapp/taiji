# cross-period ordinal identity and the template grammar verified
# panic-free through the fuzz surface; the sidx materialization arm
# rides this target plus the bmff extension.
[[bin]]
name = "mpd_parse"
path = "fuzz_targets/mpd_parse.rs"
test = false
doc = false
bench = false
