# ==============================================================================
# taiji ↔ aria2 (v1) 偏差台账 / deviations ledger
#   文件:docs/compat/aria2-v1-deviations.yaml
#
# 【用途】
#   taiji 与 aria2 v1 基线(上游 aria2 1.37.0 及 Motrix fork)之间全部已声明偏差的
#   权威登记表。每一处 taiji ↔ aria2 行为差异都必须以条目形式在此登记;
#   未登记的漂移(unregistered drift)一律禁止,一律视为回归。
#
# 【消费方式】
#   - 当前阶段:文档消费 —— 评审 / PR 审查 / 审计对照,人工读取。
#   - Phase C 起:差分测试(aria2_compat_live_diff.rs 一脉)读取本台账,按条目 id
#     逐条豁免 —— 只有命中本台账 id 的观测差异才允许通过;台账之外的差异一律红。
#
# 【修改规则】
#   - 新增偏差 = 必须先在本台账登记,并在 PR 里逐条说明(为何是偏差、锚点在哪、
#     影响面多大);未登记先上线即属禁止的漂移。
#   - 移除条目同样必须开 PR 并逐条说明(该偏差为何不再成立:已收敛 / 已回退 /
#     登记有误)。禁止任何静默增删;PR 描述必须能逐条对应到本文件的 diff。
#
# 【条目结构】每条固定五字段:
#   id    稳定标识 —— 差分测试按此豁免;一经差分测试引用即不得改名
#   kind  known-deviation | taiji-extension | fold | test-gating 四选一
#   where 主锚点( taiji 侧 path:lines )
#   what  偏差声明(这处分歧是什么、为何声明)
#   refs  证据链(源码注释 / aria2 对等源码 / pin 测试 / 审计报告 / 提交号 / 文档锚)
#   条目按 kind 分组排列:known-deviation → taiji-extension → fold → test-gating。
#   where 格式:一律单段 `taiji/…:<起>-<止>`(或单行号),全表无多段/逗号缩写。
#   路径约定(refs 为人工证据链,允许短路径;机器消费只依赖 id/kind/where):
#     - `taiji/…`                              工作区根(motrix-app)相对路径;
#     - `docs/…`、`crates/…`                   taiji 仓库根相对路径;
#     - `<crate>/src/…`(如 taiji-rpc/src/…)   = taiji/crates/<crate>/src/…;
#     - `aria2-1.37.0/…`                       工作区根的 aria2 参考树(与 taiji/ 平级),
#                                              aria2 侧裸名(如 RpcMethodImpl.cc)按其 src/ 解析;
#     - 裸文件名                                按提及处上下文解析(多为该条 where 的文件
#                                              或其 crate,跨 crate 提及处均带中文限定词),
#                                              机器不解析 refs;
#     - `taiji-implicit-state-machines-zh.md`   工作区根审计报告。
#
# 【统计快照】2026-11-10 创建,共 46 条;2026-11-14 Phase C 台账接线扩至 56 条:
#   known-deviation 24 · taiji-extension 28 · fold 2 · test-gating 2
#   2026-11-14 扩条(Phase C 差分测试改为按本台账 id 豁免):新增 9 条
#   known-deviation(method-face-missing / echo-shared-value-faces /
#   getoption-echo-face / http-option-invalid-tightening /
#   status-progress-granularity / pre-probe-projection / sftp-deferred /
#   unknown-scheme / add-torrent-base64)+ 1 条 taiji-extension
#   (echo-taiji-only-budget,38 键预算);扩 4 条既有条目 stanza 补全键清单
#   (getglobaloption-echo-subset / media-option-family / four-pool-budgets /
#   diff-whitelist-governance refs)。差分侧 WHITELIST id 同步改名为台账 id。
#   2026-11-10 复核修订:where 收敛单段格式(extension-events,原双锚点逗号缩写);
#   修正 5 处 refs 悬空路径(taiji/src/… ×4、taiji/tests/… ×1,实际位于
#   taiji/crates/taiji/… 下,已逐处对行核实引文);known-deviation 组加注 2 条对齐锚
#   口径。条目数、分组与五字段结构不变。
# ==============================================================================

